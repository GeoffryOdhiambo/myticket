server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # Re-resolve the `app` container on every request so redeploying app
    # never leaves nginx pointed at a stale container IP.
    resolver 127.0.0.11 valid=10s;

    client_max_body_size 20M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Trust the real client IP from X-Real-IP only when it's forwarded by
    # something on private/Docker-internal address space (i.e. genuinely
    # Traefik) — trusting 0.0.0.0/0 would let any visitor spoof their own
    # source IP for logging and rate limiting.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss application/atom+xml image/svg+xml font/ttf font/otf;

    # Vite output filenames are content-hashed, so a build never reuses a
    # stale asset's URL — safe to cache indefinitely.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Uploaded files served straight from the shared storage volume.
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        set $upstream_app app:9000;
        fastcgi_pass $upstream_app;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /dev/stdout;
    error_log /dev/stderr;
}
